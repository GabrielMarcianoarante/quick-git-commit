name: Release

# Para lançar uma versão:
#   1. aumente "version" no package.json e adicione a seção "## X.Y.Z" no CHANGELOG.md
#   2. faça commit e envie
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Conferir se a tag bate com o package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag (${GITHUB_REF_NAME}) não bate com a versão do package.json (v${PKG_VERSION})." >&2
            exit 1
          fi

      - name: Gerar o .vsix e a soma de verificação
        run: |
          npm run package
          sha256sum ./*.vsix > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Montar o texto da release
        run: |
          PREV="$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "${PREV}" > release-notes.md
          cat release-notes.md

      - name: Criar a release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--latest"
          case "${GITHUB_REF_NAME}" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" ./*.vsix ./SHA256SUMS.txt \
            --title "Quick Git Commit ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            ${FLAGS}
